<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurorah Digital Hub - Mobile App Wireframe</title>
  <style>
    :root{
      --bg:#f6f6f6;
      --border:#6f6f6f;
      --fill:#ffffff;
      --muted:#ececec;
      --text:#222;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .page{
      max-width:460px;
      margin:0 auto;
      padding:18px 12px 24px;
    }
    .title{
      text-align:center;
      font-size:20px;
      font-weight:700;
      margin:6px 0 14px;
      line-height:1.3;
    }
    .phone{
      border:2px solid var(--border);
      background:#fff;
      border-radius:24px;
      overflow:hidden;
      min-height:920px;
      display:flex;
      flex-direction:column;
    }
    .header{
      position:sticky;
      top:0;
      background:var(--muted);
      border-bottom:2px solid var(--border);
      padding:16px;
      text-align:center;
      font-size:18px;
      font-weight:700;
      min-height:64px;
      z-index:2;
    }
    .content{
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
      flex:1;
      overflow:auto;
    }
    .panel{
      border:2px solid var(--border);
      background:var(--fill);
      padding:14px;
    }
    .panel h2{
      font-size:16px;
      margin:0 0 12px;
      text-align:center;
    }
    .actions{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .action{
      border:2px solid var(--border);
      background:var(--muted);
      padding:14px;
      text-align:center;
      font-weight:700;
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .feed-list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .feed-card{
      border:2px solid var(--border);
      background:var(--fill);
      min-height:88px;
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .feed-card .thumb{
      height:20px;
      background:var(--muted);
      border:2px dashed var(--border);
    }
    .feed-card .line{
      height:10px;
      background:var(--muted);
      border:1px solid var(--border);
      width:80%;
    }
    .bottom-nav{
      border-top:2px solid var(--border);
      background:var(--muted);
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:0;
      position:sticky;
      bottom:0;
      z-index:2;
    }
    .bottom-nav div{
      border-right:1px solid var(--border);
      padding:12px 6px;
      text-align:center;
      font-size:12px;
      min-height:52px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
    }
    .bottom-nav div:last-child{border-right:none}
  </style>
</head>
<body>
  <div class="page">
    <div class="title">Aurorah Digital Hub - Mobile App Wireframe (Low-Fidelity)</div>

    <div class="phone">
      <div class="header">Aurorah Digital Hub</div>

      <div class="content">
        <section class="panel">
          <h2>Quick Action Panel</h2>
          <div class="actions">
            <div class="action">Volunteer</div>
            <div class="action">Donate</div>
            <div class="action">Need Help</div>
          </div>
        </section>

        <section class="panel">
          <h2>Home Feed</h2>
          <div class="feed-list">
            <div class="feed-card">
              <div class="thumb"></div>
              <div class="line"></div>
              <div class="line" style="width:65%"></div>
            </div>
            <div class="feed-card">
              <div class="thumb"></div>
              <div class="line"></div>
              <div class="line" style="width:70%"></div>
            </div>
            <div class="feed-card">
              <div class="thumb"></div>
              <div class="line"></div>
              <div class="line" style="width:60%"></div>
            </div>
            <div class="feed-card">
              <div class="thumb"></div>
              <div class="line"></div>
              <div class="line" style="width:75%"></div>
            </div>
          </div>
        </section>
      </div>

      <nav class="bottom-nav" aria-label="Bottom navigation">
        <div>Home</div>
        <div>Volunteer</div>
        <div>Donate</div>
        <div>News</div>
        <div>Profile</div>
      </nav>
    </div>
  </div>
</body>
</html>
